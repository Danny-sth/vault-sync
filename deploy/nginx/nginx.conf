# vault-sync public TLS ingress (on-za-menya.online).
# Бэкенд — vault-sync на хосте: :8444 (основной волт), :8445 (доп. волт).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name on-za-menya.online;

    # ACME http-01 (certbot webroot) — только по plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name on-za-menya.online;

    ssl_certificate     /etc/letsencrypt/live/on-za-menya.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/on-za-menya.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # Синк устройств (Obsidian-плагин): wss://on-za-menya.online/vault-sync/ws.
    # Токен проверяет сам vault-sync (STOMP), edge-гейта нет.
    location /vault-sync/ws {
        rewrite ^/vault-sync/ws$ /ws break;
        proxy_pass http://host.docker.internal:8444;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST vault-sync.
    location /vault-sync/api/ {
        if ($edge_ok = 0) { return 401; }
        rewrite ^/vault-sync/api/(.*)$ /api/$1 break;
        proxy_pass http://host.docker.internal:8444;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        client_max_body_size 200m;
    }

    # MCP (local-mcp мост, vault-cli): Streamable HTTP.
    location /vault-mcp {
        if ($edge_ok = 0) { return 401; }
        proxy_pass http://host.docker.internal:8444/mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # MCP доп. волта (extra-vaults, :8445).
    location /vault-sync-2-mcp {
        if ($edge_ok = 0) { return 401; }
        proxy_pass http://host.docker.internal:8445/mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        return 404;
    }
}
