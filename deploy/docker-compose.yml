## vault-sync edge: публичный TLS-вход ${DOMAIN} → vault-sync (host :8444).
## Самостоятельный стек проекта vault-sync. Поднимается ТОЛЬКО через ./install.sh.
##   nginx   — TLS + edge-токен (X-Auth-Token) + роуты /vault-sync/ws, /vault-sync/api/, /vault-mcp
##   certbot — автопродление Let's Encrypt (webroot)
## Конфиги nginx — штатные шаблоны образа (/etc/nginx/templates/*.template → envsubst на старте),
## значения DOMAIN / VAULT_SYNC_TOKEN — из deploy/.env (секрет, не в git).
name: vault-sync-edge

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: vault-sync-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN не задан в deploy/.env}
      VAULT_SYNC_TOKEN: ${VAULT_SYNC_TOKEN:?VAULT_SYNC_TOKEN не задан в deploy/.env}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
      # access.log читает fail2ban (бан IP при 401 без edge-токена).
      - ./nginx/log:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # reload раз в 6ч — подхватить продлённые серты без рестарта.
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    container_name: vault-sync-certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  letsencrypt:
  certbot-www:
