## vault-sync edge: публичный TLS-вход on-za-menya.online → vault-sync (host :8444/:8445).
## Самостоятельный стек проекта vault-sync (без зависимостей от других проектов).
##   nginx   — TLS + edge-токен (X-Auth-Token) + роуты /vault-sync/ws, /vault-sync/api/, /vault-mcp
##   certbot — автопродление Let's Encrypt (webroot)
## Запуск на VPS: cd /root/vault-sync/deploy && docker compose up -d
name: vault-sync-edge

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: vault-sync-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Секрет: map $http_x_auth_token → $edge_ok. НЕ в git (создаётся из edge-token.conf.example).
      - ./nginx/edge-token.conf:/etc/nginx/conf.d/00-edge-token.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
      # access.log читает fail2ban (бан IP при 401 без edge-токена).
      - ./nginx/log:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # reload раз в 6ч — подхватить продлённые серты без рестарта.
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    container_name: vault-sync-certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  letsencrypt:
  certbot-www:
